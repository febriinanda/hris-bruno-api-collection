info:
  name: View person by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/person/{{id}}"
  headers:
    - name: Authorization
      value: "{{access_token}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: "7"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
