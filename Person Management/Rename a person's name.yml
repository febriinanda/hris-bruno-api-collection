info:
  name: Rename a person's name
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{url}}/person/{{id}}/name"
  headers:
    - name: Authorization
      value: "{{access_token}}"
  body:
    type: json
    data: |-
      {
        "name": "{{$randomFullName}}",
        "gender": null,
        "birthDate": null
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "7"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
