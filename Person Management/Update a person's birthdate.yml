info:
  name: Update a person's birthdate
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{url}}/person/{{id}}/birthday"
  headers:
    - name: Authorization
      value: "{{access_token}}"
  body:
    type: json
    data: |-
      {
        "name": null,
        "gender": null,
        "birthDate": "{{birthDate}}"
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "6"
    - name: birthDate
      value: ""
  scripts:
    - type: before-request
      code: |-
        const start = new Date("1980-01-01");
        const end = new Date("2000-12-31");

        const randomTime =
          start.getTime() +
          Math.random() * (end.getTime() - start.getTime());

        const randomDate = new Date(randomTime);

        const birthDate = randomDate.toISOString().split("T")[0];

        bru.setVar("birthDate", birthDate);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
