info:
  name: View employee's profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/employee/{{id}}/profile"
  headers:
    - name: Authorization
      value: "{{access_token}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
