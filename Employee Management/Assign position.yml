info:
  name: Assign position
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/employee/{{id}}/assign"
  headers:
    - name: Authorization
      value: "{{access_token}}"
  body:
    type: json
    data: |-
      {
        "position":{
          "id":1
        },
        "startDate":"{{$randomDateFuture}}",
        "endDate":null
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
